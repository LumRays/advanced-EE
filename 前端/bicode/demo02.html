<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表格</title>
</head>
<body>
    <table border="1" width="500" height="320" cellspacing="0" cellpadding="65" align="center">
        <!-- thead 里面的内容居中，而且加粗展示 -->
        <thead>
            <tr>
                <th>姓名</th>
                <th>性别</th>
                <th>年龄</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>张三</td>
                <td rowspan="2">男</td>
                <td>18</td>
            </tr>
            <tr>
                <td>李四</td>
                <!-- <td>男</td> -->
                <td>20</td>
            </tr>
            <tr>
                <td>王五</td>
                <td>女</td>
                <td>18</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
