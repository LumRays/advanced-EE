<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>弹性布局</title>
</head>
<body>
    <div>
        <span>1</span>
        <span>2</span>
        <span>3</span>
    </div>
    <style>
        div {
            height: 700px;
            width: 700px;
            background-color: rgb(246, 250, 112);
            display: flex;
            justify-content: center;
        }
        div span {
            height: 100px;
            width: 100px;
            background-color: rgb(228, 84, 84);
        }
    </style>
</body>
</html>
