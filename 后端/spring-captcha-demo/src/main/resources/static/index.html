<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7fb">
  <title>验证码校验</title>
  <style>
    :root { color-scheme: light; --ink:#17243b; --muted:#718096; --blue:#356df3; --line:#e4eaf3; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif; color:var(--ink); background:radial-gradient(ellipse at 15% 10%,#e8efff 0,transparent 36%),radial-gradient(ellipse at 90% 90%,#e8f6f5 0,transparent 34%),#f7f9fc; }
    .card { width:min(100%,480px); padding:42px; background:#fff; border:1px solid rgba(226,233,243,.9); border-radius:22px; box-shadow:0 24px 70px rgba(35,57,94,.12); }
    .badge { width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:#edf2ff;color:var(--blue);font-size:23px;margin-bottom:26px; }
    .eyebrow { margin:0 0 8px;color:var(--blue);font-size:12px;font-weight:700;letter-spacing:.13em;text-transform:uppercase; }
    h1 { margin:0;font-size:28px;letter-spacing:-.04em; }
    .intro { margin:10px 0 28px;color:var(--muted);font-size:14px;line-height:1.7; }
    label { display:block;margin-bottom:9px;font-size:13px;font-weight:650; }
    .input { width:100%;height:50px;padding:0 15px;border:1px solid var(--line);border-radius:11px;outline:none;font:inherit;transition:.2s; }
    .input:focus { border-color:var(--blue);box-shadow:0 0 0 4px rgba(53,109,243,.12); }
    .captcha-row { display:flex;align-items:center;gap:12px;margin:14px 0 21px; }
    #verificationCodeImg { width:148px;height:50px;object-fit:cover;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:#f3f6fb; }
    .refresh { border:0;background:none;color:var(--blue);font:inherit;font-size:13px;cursor:pointer;padding:8px 0; }
    #checkCaptcha { width:100%;height:50px;border:0;border-radius:11px;background:linear-gradient(135deg,#477df7,#315fe4);color:white;font:inherit;font-weight:650;cursor:pointer;box-shadow:0 8px 18px rgba(53,109,243,.22);transition:transform .15s,filter .15s; }
    #checkCaptcha:hover { filter:brightness(1.04);transform:translateY(-1px); }
    .hint { margin:16px 0 0;text-align:center;color:#98a3b4;font-size:12px; }
    @media(max-width:480px){.card{padding:30px 23px}.captcha-row{gap:8px}#verificationCodeImg{width:132px}}
  </style>
</head>
<body>
  <main class="card">
    <div class="badge" aria-hidden="true">✓</div>
    <p class="eyebrow">SECURITY CHECK</p>
    <h1>验证一下，继续访问</h1>
    <p class="intro">请输入图片中的验证码，完成安全校验。</p>
    <label for="inputCaptcha">验证码</label>
    <input class="input" type="text" name="inputCaptcha" id="inputCaptcha" placeholder="请输入验证码" autocomplete="off" aria-label="请输入验证码">
    <div class="captcha-row">
      <img id="verificationCodeImg" src="/captcha/getCaptcha" title="看不清？换一张" alt="验证码图片">
      <button class="refresh" type="button" id="refreshCaptcha">看不清，换一张 ↻</button>
    </div>
    <input type="button" value="提交验证" id="checkCaptcha">
    <p class="hint">点击验证码图片也可以刷新</p>
  </main>
  <script>
    const captcha = document.getElementById('verificationCodeImg');
    function refreshCaptcha() {
      captcha.src = '/captcha/getCaptcha?dt=' + Date.now();
    }
    captcha.addEventListener('click', refreshCaptcha);
    document.getElementById('refreshCaptcha').addEventListener('click', refreshCaptcha);
    document.getElementById('checkCaptcha').addEventListener('click', function () {
      alert('验证码校验');
    });
    document.getElementById('inputCaptcha').addEventListener('keydown', function (event) {
      if (event.key === 'Enter') document.getElementById('checkCaptcha').click();
    });
  </script>
</body>
</html>
