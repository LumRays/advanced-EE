<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7fb">
  <title>验证成功</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:#17243b;background:radial-gradient(ellipse at 15% 10%,#e8efff 0,transparent 36%),radial-gradient(ellipse at 90% 90%,#e8f6f5 0,transparent 34%),#f7f9fc}.card{width:min(100%,460px);padding:48px 42px;text-align:center;background:white;border:1px solid #e4eaf3;border-radius:22px;box-shadow:0 24px 70px rgba(35,57,94,.12)}.icon{width:68px;height:68px;margin:0 auto 24px;display:grid;place-items:center;border-radius:50%;background:#e9f8f0;color:#20a464;font-size:34px}h1{margin:0;font-size:28px;letter-spacing:-.04em}.desc{margin:12px 0 28px;color:#718096;font-size:14px;line-height:1.7}a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:11px;background:#356df3;color:white;text-decoration:none;font-size:14px;font-weight:650;box-shadow:0 8px 18px rgba(53,109,243,.2)}a:hover{background:#2c5ed9}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">✓</div>
    <h1>验证成功</h1>
    <p class="desc">安全校验已完成，你现在可以继续访问。</p>
    <a href="/">返回首页</a>
  </main>
</body>
</html>
